schema: spec-driven

context: |
  项目：ReBaseAgent — Agent 的时间旅行调试器（本地优先的 Electron 桌面应用）

  定位句：不止回放 Agent 做了什么，而是让你改变它做了什么。
  本地保存轨迹与文件快照；真实模型请求按用户配置发送给服务商。

  概念内核：上下文是 Agent 行为的程序（Context is the program）。
  产品 = 给这门"语言"的调试器。此概念只作透镜统一命名，不扩大工程范围。

  目标用户：自研 Agent loop、需要录制与调试模型调用的开发者，中文用户为主。
  模型接入以 OpenAI 兼容协议为准，不限定服务商或模型品牌。
  原生创建无需接入外部项目；外部 Agent 可接 trace-sdk，或修改 base_url 使用录制代理。
  不承诺任何外部 CLI/IDE/框架的官方适配；导入/格式转换按实际需求另立 change。

  当前技术栈（以源码与依赖清单为准）：
  - TypeScript strict + electron-vite + pnpm workspaces（monorepo）
  - packages/：agent-loop（纯 TS 库，零 Electron 依赖）、trace-sdk、llm-proxy、replay、trace-test
  - apps/desktop：Electron 壳，消费包层能力
  - UI：React + Tailwind + zustand；可视化：ECharts + Monaco（懒加载）
  - 存储：JSONL 为轨迹事实源（一 run 一文件，append-only）；隔离文件附件按内容寻址
  - 模型接入：OpenAI 兼容协议直连（fetch + SSE，eventsource-parser）
  - 质量：Biome + vitest + TypeScript + OpenSpec；桌面交互另附 Electron/CDP 实机证据
  - 打包：electron-builder，当前配置为 Windows x64 portable；其他平台与安装包未交付
  - 校验：zod；模型设置密钥优先用 Electron safeStorage，加密不可用时明文降级并提示

  关键架构不变量（所有 spec 必须遵守）：
  - Loop 通过 config/messages、tracer 和注入的 tools/llm 执行；messages 只追加；
    计数与成本从 messages 派生，无模块级可变状态。具体输入与终止语义以 agent-loop 主 spec 为准
  - 工具失败记录为带 error 的 tool_result；模型请求失败记录 llm.call.error 并以 errored 收尾
  - JSONL 轨迹在终止事件写入后封存；分叉只创建新轨迹，不改写父本；有子分支的删除需保护
  - 便携版业务数据落 exe 旁 data/ 或用户指定的数据目录；启动器可能产生临时解包文件
  - 代理捕获的 key 仅在 main 内存中使用，不落盘、不回传 renderer；不能用模型设置 key 替代
  - IPC 与 trace 均须校验；来源缺失、损坏或未知状态不能被 UI 猜测补造为可信事实

  时间旅行与执行边界：
  - 普通 tool_result 续跑复用分叉前消息（零模型调用），分叉后真实调用模型与工具，不恢复外部状态
  - prompt fork 修改启动上下文后从头执行；代理 messages 只重发一个模型请求，不执行外部工具
  - 隔离 tool_result 续跑从编辑点所在整轮的轮末文件快照副本继续；编辑观察不撤销同轮写入
  - 隔离只保真受控普通文件的路径与字节，保护父本、源目录和兄弟分支；不是操作系统权限沙箱
  - 不承诺恢复网络、RAG、记忆、数据库或任意外部 API；隔离父本的 prompt/模型实验仍不支持
  - 主动操作统一由 main 登记、去重并占单个执行槽；未知先核对，按可信 ID 只读核实结果
  - 草稿正文与阅读位置只在 renderer 会话内恢复；执行授权与实验计划绑定当前提交和配置

  当前进度（2026-10-22 校准）：MVP/v2、Trace-as-Test、普通模型 A/B、隔离 A/B/C、U1–U8、R2.1、refine-ui、
  refactor-desktop-renderer-modules（渲染层三大文件按职责拆分，纯内部重构）与 R2.2
  `add-isolated-prompt-experiments`（隔离根初始快照的单项启动指令实验、trace v3 兼容、跨运行检查点/文件比较、
  单侧 R2.1 导出闭环）均已归档。R2.2 已在源码主线实现并通过 7.1 真实模型（package-layer）、
  7.2/7.3 Electron 实机与 7.4 全仓门禁，**尚未打包、未进入任何发行包**；最新发行候选仍是 0.5.0-rc.1。
  R2.1 为选定检查点普通文件、来源清单与适用文本补丁导出，不含 trace 分享包或自动应用。
  拆分后 store.ts/DetailPanel/WorkspaceFileView 为组合/连接层，规模与归属见
  docs/engineering/reports/2026-10-19-rrm-renderer-split-scale-report.md。
  历史 K1 仅含隔离 A/B/C 与 U1/U2；0.5.0-rc.1 已有 R2.1/refine-ui 构建记录，维护者 10/16 确认已打包上传。
  上传状态来自维护者确认，不代替独立下载或实包验收；重构不追溯为既有发行的前置条件。
  R2.2 的隔离 prompt 实验只接受合法根基线，中途分支只能导航回根；v3 父本不能转普通 prompt fork；
  隔离父本/分支上的 prompt fork 与模型 A/B 仍不支持。跨运行文件比较只读、固定两侧自有检查点，
  不自动换点、不写 trace/附件。R3 技术验证可独立准备；下一项新增能力为 R3。
  Shell/真实测试（R3）、真正取消/实时步骤、跨 main 重启任务恢复、隔离父本/分支 prompt 与模型实验等
  仍属后续范围，不得显示为已交付。
  当前能力查 openspec/specs/ 与源码；归档证据查 openspec/changes/archive/；
  进度与发行范围查 docs/development/project-status.md，未来范围与排序查 docs/product/evolution-roadmap.md。
  项目许可为 MIT，第三方内容沿用其适用许可。

rules:
  proposal:
    - 每份 proposal 必须含 "Non-goals" 章节，明确列出本次不做的事
    - 涉及时间旅行/replay 的能力，必须声明消息复用、文件快照与工具副作用的保真度边界
    - 不引入已定稿技术栈之外的新依赖，除非 proposal 显式说明理由
  tasks:
    - 任务粒度控制在 2 小时以内
    - 每个实现任务须对应可验证的验收标准（对应 spec 中的 scenario）

operations:
  apply:
    guidance:
      - 实现时若发现 spec 设计有误，先回 proposal 修订再继续，勿静默偏离
  archive:
    guidance:
      - 归档时逐项核对 scenario 与测试/fixture/实机证据；未覆盖或实机不成立的项目如实记录
      - 合并 delta 后核对既有 requirement/scenario 无遗漏；同步受影响的当前文档与归档链接，归档不等于发行
