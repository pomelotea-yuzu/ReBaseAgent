name: Feature request / 功能建议
description: Suggest a new capability or improvement / 提出新能力或改进想法
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: What problem are you trying to solve? / 想解决什么问题
      description: "Describe your debugging scenario and blocker rather than jumping to an implementation. Example: after A/B branches finish, I cannot tell where the cost difference comes from. / 描述你的调试场景与卡点，而不是直接给实现方案。例如：A/B 两个分支跑完后，看不出费用差异是怎么来的。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired outcome / 期望的效果
      description: How you would ideally use it (UI sketches or CLI examples are welcome). / 你理想中的使用方式（界面草图、命令行示例都可以）。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround / 现在的替代做法
      description: How you currently work around this limitation. / 目前你是怎么绕过这个限制的。
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional) / 补充上下文（可选）
      description: Related issues, screenshots, or comparisons with other products. / 相关 issue、截图或竞品对照。
